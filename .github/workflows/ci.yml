name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - run: pytest -q tests

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Prometheus config and alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.54.1 check rules /etc/prometheus/alerts.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w/tests --entrypoint promtool \
            prom/prometheus:v2.54.1 test rules alerts_test.yml
      - name: Alertmanager config (amtool)
        run: |
          cp .env.example .env && bash scripts/render-config.sh
          docker run --rm -v "$PWD/monitoring:/cfg" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml
      - name: Nginx config
        run: |
          docker run --rm --add-host app:127.0.0.1 --add-host grafana:127.0.0.1 \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloud-capstone-app:ci ./app
